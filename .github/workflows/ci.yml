name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authforge_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/authforge_test
      # Not a secret: a throwaway signing key for the test database only.
      SESSION_JWT_SECRET: ci-signing-key-not-used-outside-continuous-integration
      SESSION_JWT_TTL: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @authforge/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
